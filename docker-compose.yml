services:
  api:
    build: .
    command: npx nodemon -L --watch src src/app.js
    ports:
      - "5000:5000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
      - PORT=5000
      - API_PREFIX=/api/v1
      - DATABASE_URL=postgresql://postgres:password@db:5432/family_tree_db?schema=public
      - JWT_ACCESS_SECRET=your_jwt_access_secret_here_64_chars_minimum
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret_here_64_chars_minimum
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - GOOGLE_CLIENT_ID=your_google_client_id
      - GOOGLE_CLIENT_SECRET=your_google_client_secret
      - GOOGLE_CALLBACK_URL=http://localhost:5000/api/v1/auth/google/callback
      - ALLOWED_ORIGINS=http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - AUTH_RATE_LIMIT_MAX=10
      - APP_NAME=FamilyTreeAPI
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - db
    networks:
      - family-tree-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=family_tree_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - family-tree-network

volumes:
  postgres_data:

networks:
  family-tree-network:
    driver: bridge